<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Modo Cinema Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s;
        }

        h1 {
            margin-bottom: 15px;
            color: #e50914;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        /* Container Principal */
        .cinema-container {
            width: 100%;
            max-width: 950px;
            background: #141414;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* Barra Superior (Info do Vídeo) */
        .cinema-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
        }

        .queue-badge {
            font-weight: bold;
            color: #ffffff;
            background: #e50914;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .time-display {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.05rem;
            background: #2a2a2a;
            padding: 5px 14px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, color 0.2s;
            border: 1px solid #333;
        }

        .time-display:hover {
            background: #333;
            color: #e50914;
        }

        /* Área do Player de Vídeo */
        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Proporção 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .player-wrapper iframe, .player-wrapper div {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Controls & Buttons */
        .controls-panel {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .btn-cinema { background-color: #e50914; color: white; flex: 2; }
        .btn-cinema:hover { background-color: #b80710; }

        .btn-next { background-color: #333; color: white; flex: 1; }
        .btn-next:hover { background-color: #444; }

        .btn-toggle-inputs {
            background-color: #1a1a1a;
            color: #aaa;
            border: 1px dashed #444;
            width: 100%;
            margin-top: 5px;
        }

        .btn-toggle-inputs:hover {
            background-color: #252525;
            color: #fff;
            border-color: #666;
        }

        /* Seção Retrátil de Links */
        .inputs-section {
            display: none;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid #2a2a2a;
            flex-direction: column;
            gap: 10px;
        }

        .inputs-section.active { display: flex; }

        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .input-row { display: flex; gap: 8px; }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        input[type="text"]:focus { border-color: #e50914; }

        .btn-remove {
            background-color: #2a2a2a;
            color: #ff4d4d;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-remove:hover { background-color: #3a3a3a; }

        .btn-add { background-color: #2e7d32; color: white; margin-top: 5px; }
        .btn-add:hover { background-color: #1b5e20; }

        /* ==================== MODO CINEMA (EXPANDIDO) ==================== */
        body.in-cinema-mode {
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body.in-cinema-mode h1,
        body.in-cinema-mode .btn-toggle-inputs,
        body.in-cinema-mode .inputs-section {
            display: none !important;
        }

        body.in-cinema-mode .cinema-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            max-width: 100vw;
            border-radius: 0;
            padding: 15px;
            background: #000;
            box-shadow: none;
        }

        body.in-cinema-mode .player-wrapper {
            flex: 1;
            padding-bottom: 0;
            height: 100%;
        }
    </style>
</head>

            </div>
        </div>

            <div id="player"></div>
